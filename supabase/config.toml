project_id = "usqiyekfmwwnvkmkdlej"


# A matriz de permissao roda ANTES do resto: sem `app_recursos` e `role_permissoes`
# populadas, `tem_permissao()` nega tudo e o banco local nasce inutilizavel.
[db.seed]
enabled = true
sql_paths = ['./seeds/01_matriz_permissao.sql', './seed.sql']

[functions.webhook-leads]
verify_jwt = false

[functions.webhook-leads-time-comercial]
verify_jwt = false

[functions.setup-admin]
verify_jwt = false

[functions.setup-status]
verify_jwt = false

[functions.admin-create-user]
verify_jwt = true

# A função valida o JWT no próprio código para poder responder com mensagens de
# confirmação e manter a autenticação uniforme entre painel e chamadas internas.
[functions.equipe-11ds-chat]
verify_jwt = false

# O orquestrador valida o JWT no próprio código e usa a service role apenas
# depois de vincular o plano ao usuário autenticado.
[functions.equipe-11ds-orquestrador]
verify_jwt = false

# Worker interno: conclui no GitHub/Obsidian apenas memórias já persistidas e
# confirmadas. A autenticação usa x-cron-key dentro da própria função.
[functions.equipe-11ds-memoria-sync]
verify_jwt = false

# Function interna: só evo-resposta chama, server-to-server. A autenticação
# valida o service role key no próprio código (ver comentário no index.ts).
[functions.cobranca-ia-responder]
verify_jwt = false
